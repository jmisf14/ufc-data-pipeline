name: Load External UFC Tables to Supabase

on:
  workflow_dispatch:  # Permite ejecución manual
  schedule:
    # Cada lunes a las 21:00 UTC (1 hora después del scraper principal)
    # Esto asegura que los datos del scraper principal estén actualizados primero
    - cron: "0 21 * * 1"

jobs:
  load_external_tables:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # Aumentado para manejar descargas grandes y timeouts
    
    env:
      POSTGRES_HOST: ${{ secrets.SUPABASE_DB_HOST }}
      POSTGRES_PORT: ${{ secrets.SUPABASE_DB_PORT }}
      POSTGRES_DB: ${{ secrets.SUPABASE_DB_NAME }}
      POSTGRES_USER: ${{ secrets.SUPABASE_DB_USER }}
      POSTGRES_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGSSLMODE: require

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "app/requirements.txt"
      
      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt
      
      - name: Load external tables to Supabase
        working-directory: app
        run: |
          python scripts/integrate_external_tables.py
      
      - name: Report success
        if: success()
        run: |
          echo "✅ Tablas externas cargadas exitosamente:"
          echo "   - external_fight_results"
          echo "   - external_fighter_tott"
          echo "   - external_fight_stats"
