name: UFCStats scrape to Supabase

on:
  workflow_dispatch:
  schedule:
    # Every Monday 12:00 UTC (example)
    - cron: "0 20 * * 1"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      POSTGRES_HOST: ${{ secrets.SUPABASE_DB_HOST }}
      POSTGRES_PORT: ${{ secrets.SUPABASE_DB_PORT }}
      POSTGRES_DB: ${{ secrets.SUPABASE_DB_NAME }}
      POSTGRES_USER: ${{ secrets.SUPABASE_DB_USER }}
      POSTGRES_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGSSLMODE: require

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "app/requirements.txt"
      - run: pip install -r app/requirements.txt
      - name: Run Scrapy crawl
        working-directory: app/stat_scrape
        run: |
          scrapy crawl ufcstatspider
          scrapy crawl ufc ufcstatsupcomingspider

